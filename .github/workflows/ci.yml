name: CI

# Why this exists: every check in this repo used to run only when a human
# remembered to run it, and that failed silently more than once —
# e2e/chat.spec.ts never actually ran for weeks (it read a NEXT_PUBLIC_* flag
# the test process couldn't see and quietly took its "disabled" branch), and a
# failing `next build` was once masked by piping it into grep. The guard tests
# we rely on (the 24k context-pack ceiling, EN/ES parity, numbered-key drift,
# "the phone number is not the placeholder") only protect anything if something
# runs them on every push.

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the dev machine (24.x), so CI cannot disagree with local
          # over a Node version difference.
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`, and that is deliberate. npm records the
      # optional-dependency subtree only for the platform the lockfile was
      # generated on. This lock comes from a Windows machine, so it lacks the
      # Linux @emnapi/runtime that @img/sharp-wasm32 and
      # @tailwindcss/oxide-wasm32-wasi resolve to, and `npm ci` fails here with
      # EUSAGE "Missing: @emnapi/runtime from lock file". Regenerating the lock
      # on Linux only moves that failure onto the dev machine — verified both
      # directions. `npm install` still resolves from the lockfile where it can,
      # and it is how Vercel builds this project too.
      - run: npm install --no-audit --no-fund

      # Cheapest signal first, so a type error does not wait behind a build.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # --no-file-parallelism on purpose. The two known flakes in this repo are
      # both contention-driven (resend.test.ts under full-suite parallelism, and
      # a route test with a 5s budget against ~25s of import work). CI runners
      # have fewer cores than the dev machine, so parallelism here is more
      # likely to flake, and a CI that cries wolf gets ignored. The suite runs
      # in ~10s serially; determinism is worth the seconds.
      - name: Unit tests
        run: npm test -- --no-file-parallelism

      # Catches the failure class `tsc` cannot: Next evaluates route handlers
      # during page-data collection, which is why '@/db' has to be lazily
      # imported inside the chat route's tool. Vercel only builds on pushes to
      # main, so without this a branch can look green and break on merge.
      - name: Production build
        run: npm run build

  # The browser suite, since 2026-10-27. It was kept out for one reason, stated
  # here until then: run against `next dev`, the first request to each page
  # compiled it, and those cold compiles timed out under load. It now runs
  # against the PRODUCTION server over a build made first (E2E_SERVER=start,
  # playwright.config.ts), where nothing compiles on request. Kept out of it:
  # the two `@live-platform` tests, which look inside the production
  # platform's chat and send it a question; a push must never start a real
  # conversation on production. They still run locally.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The chat launcher only exists when this is set at BUILD time, and the
      # concierge specs read it too.
      NEXT_PUBLIC_AI_ENABLED: 'true'
      E2E_SERVER: start
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`: see the verify job.
      - run: npm install --no-audit --no-fund

      # Bounded, with a retry that can work. bis-platform's CI learned both
      # halves (2026-10-26): an Ubuntu mirror can stall this step for the
      # whole job, and after a timed-out attempt the apt-get Playwright
      # started under sudo runs on holding the dpkg lock, so a retry started
      # at once fails with "Could not get lock". Wait for the lock first.
      - name: Install Chromium for Playwright
        timeout-minutes: 18
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=20s 6m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt failed or exceeded 6 minutes"
            for _ in $(seq 1 48); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1 || break
              sleep 5
            done
          done
          echo "::error::Chromium install failed twice; see the apt output above"
          exit 1

      - name: Production build
        run: npm run build

      - name: Playwright
        run: npx playwright test --grep-invert @live-platform --workers=2

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
