name: Generate Señal art

# The art for the site's empty slots (art/README.md), made on a runner so the
# Higgsfield key never has to leave GitHub: it lives in the HF_CREDENTIALS
# repository secret (key-id:key-secret) and is read only by this job.
#
# A button, never a schedule: every job spends credits. The default runs the
# two pieces that change the site most (the CTA band on every page and the
# share image); blank runs all twenty. The greyscale takes come back as an
# artifact with a contact sheet (index.html) for choosing one per slot; the
# chosen takes are tinted and committed afterwards, by scripts/art-tint.py.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Job names from art/brief.json, comma-separated (blank = all 20)'
        type: string
        default: 'cta-band,og-plate'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
    steps:
      - name: Check the secret is configured
        run: |
          if [ -z "$HF_CREDENTIALS" ]; then
            echo "::error::Add the HF_CREDENTIALS repository secret (key-id:key-secret) first."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # `npm install`, not `npm ci`: the lockfile comes from Windows (see ci.yml).
      - run: npm install --no-audit --no-fund

      - name: Generate
        run: npx tsx index.ts --jobs art/brief.json --only "${{ inputs.only }}"

      - name: Contact sheet
        if: always()
        run: node scripts/art-sheet.mjs art/raw || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: senal-takes
          path: |
            art/raw/
            public/art/manifest.json
          if-no-files-found: warn
          retention-days: 14
